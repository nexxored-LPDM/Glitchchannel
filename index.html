<style>
  :root{
    --bg: #08080a;
    --panel: #111114;
    --line: #232327;
    --green: #39FF6A;
    --green-dim: #1f8f43;
    --red: #ff3b3b;
    --text: #f5f5f5;
    --muted: #8a8a92;

    --font-display: "Space Grotesk", "Helvetica Neue", system-ui, sans-serif;
    --font-mono: "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace;

    --radius: 4px;
    --ease: cubic-bezier(.2,.8,.2,1);
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; }
  }

  html, body{ min-height:100%; }

  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-display);
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    overflow-x:hidden;
    position:relative;
    padding:24px;
  }

  /* scanlines */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background:repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,.018) 3px);
    pointer-events:none;
    z-index:1;
  }

  body::after{
    content:"";
    position:fixed;
    inset:0;
    background:radial-gradient(ellipse at 50% 0%, rgba(57,255,106,.07), transparent 60%);
    pointer-events:none;
    z-index:0;
  }

  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; }

  a:focus-visible,
  button:focus-visible,
  input:focus-visible{
    outline:2px solid var(--green);
    outline-offset:3px;
  }

  /* ---------- sponsors ---------- */
  .sponsors{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-items:stretch;
    gap:14px;
    margin-bottom:36px;
    z-index:2;
  }

  .sponsors a{
    width:120px;
    height:58px;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#fff;
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:10px 14px;
    opacity:.85;
    transition:transform .2s var(--ease), border-color .2s var(--ease), box-shadow .2s var(--ease), opacity .2s var(--ease);
  }

  .sponsors a:hover,
  .sponsors a:focus-visible{
    transform:translateY(-3px);
    border-color:var(--green-dim);
    box-shadow:0 0 24px rgba(57,255,106,.18);
    opacity:1;
  }

  .sponsors img,
  .sponsors svg{
    max-width:100%;
    max-height:100%;
    object-fit:contain;
  }

  /* logotipos de texto incrustados (sin imágenes externas) */
  .wordmark{
    font-family:var(--font-display);
    font-weight:700;
    font-size:19px;
    letter-spacing:-.02em;
    line-height:1;
    white-space:nowrap;
  }
  .wm-shopify{ color:#5a863e; }
  .wm-phonostar{ color:#e2001a; font-size:18px; }
  .wm-paypal{ font-size:20px; font-style:italic; }
  .wm-paypal b{ color:#003087; }
  .wm-paypal b + b{ color:#009cde; }
  .wm-openstream{ color:#111; font-size:14px; letter-spacing:-.01em; }
  .wm-openstream b{ color:#e8710a; }

  .links svg{ width:34px; height:34px; }

  /* pestaña "Auspicia aquí" */
  .sponsors a.sponsor-cta{
    background:transparent;
    border:1px dashed var(--green);
    color:var(--green);
    flex-direction:column;
    gap:3px;
    font-family:var(--font-mono);
    font-size:11px;
    font-weight:700;
    letter-spacing:.18em;
    text-transform:uppercase;
    text-align:center;
    line-height:1.2;
    opacity:1;
    position:relative;
    overflow:hidden;
  }

  .sponsors a.sponsor-cta small{
    font-size:9px;
    font-weight:400;
    letter-spacing:.12em;
    color:var(--muted);
    transition:color .2s var(--ease);
  }

  .sponsors a.sponsor-cta:hover,
  .sponsors a.sponsor-cta:focus-visible{
    background:var(--green);
    color:#000;
    border-style:solid;
    box-shadow:0 0 28px rgba(57,255,106,.35);
  }
  .sponsors a.sponsor-cta:hover small,
  .sponsors a.sponsor-cta:focus-visible small{ color:#0a3d1a; }

  /* ---------- player ---------- */
  .player{
    width:min(92vw, 520px);
    padding:56px 48px;
    background:linear-gradient(180deg, rgba(255,255,255,.025), transparent 60%);
    border:1px solid var(--line);
    border-radius:var(--radius);
    text-align:center;
    position:relative;
    z-index:2;
  }

  /* corner ticks */
  .player::before,
  .player::after{
    content:"";
    position:absolute;
    width:14px;
    height:14px;
    border:1px solid var(--green-dim);
  }
  .player::before{ top:-1px; left:-1px; border-right:none; border-bottom:none; }
  .player::after{ bottom:-1px; right:-1px; border-left:none; border-top:none; }

  .logo{
    font-size:clamp(38px, 8vw, 54px);
    font-weight:700;
    letter-spacing:.08em;
    position:relative;
    display:inline-block;
  }

  .logo span{ position:relative; display:inline-block; }

  .logo.is-glitching span::before,
  .logo.is-glitching span::after{
    content:attr(data-text);
    position:absolute;
    left:0; top:0;
    width:100%;
    overflow:hidden;
  }
  .logo.is-glitching span::before{
    color:var(--green);
    clip-path:inset(0 0 60% 0);
    transform:translate(-2px,-1px);
  }
  .logo.is-glitching span::after{
    color:var(--red);
    clip-path:inset(40% 0 0 0);
    transform:translate(2px,1px);
  }

  .sub{
    margin-top:8px;
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:.4em;
    color:var(--muted);
  }

  .live{
    margin-top:30px;
    display:inline-flex;
    align-items:center;
    gap:10px;
    font-family:var(--font-mono);
    font-size:12px;
    letter-spacing:.2em;
    color:var(--green);
  }

  .dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--green);
    animation:pulse 1.4s ease-in-out infinite;
  }

  @keyframes pulse{
    0%, 100%{ opacity:1; transform:scale(1); }
    50%{ opacity:.35; transform:scale(.7); }
  }

  /* ---------- equalizer (solo activo en directo) ---------- */
  .eq{
    margin:26px auto 0;
    height:22px;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    gap:4px;
  }
  .eq i{
    display:block;
    width:3px;
    height:4px;
    background:var(--green-dim);
    border-radius:1px;
    transition:background .2s var(--ease);
  }
  .player.is-playing .eq i{
    background:var(--green);
    animation:eq 1s ease-in-out infinite;
  }
  .eq i:nth-child(2){ animation-delay:-.2s !important; }
  .eq i:nth-child(3){ animation-delay:-.5s !important; }
  .eq i:nth-child(4){ animation-delay:-.1s !important; }
  .eq i:nth-child(5){ animation-delay:-.7s !important; }
  .eq i:nth-child(6){ animation-delay:-.35s !important; }
  .eq i:nth-child(7){ animation-delay:-.6s !important; }

  @keyframes eq{
    0%, 100%{ height:4px; }
    50%{ height:22px; }
  }

  /* ---------- controls ---------- */
  .controls{
    margin-top:30px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;
  }

  #play{
    width:64px;
    height:64px;
    border-radius:50%;
    background:transparent;
    border:1px solid var(--green);
    color:var(--green);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:background .2s var(--ease), color .2s var(--ease), transform .15s var(--ease), box-shadow .2s var(--ease);
    flex-shrink:0;
  }

  #play:hover{ background:var(--green); color:#000; box-shadow:0 0 28px rgba(57,255,106,.3); }
  #play:active{ transform:scale(.94); }
  #play svg{ width:20px; height:20px; }

  .volume{
    display:flex;
    align-items:center;
    gap:10px;
    flex:1;
    max-width:160px;
  }

  #mute{
    background:none;
    border:none;
    color:var(--muted);
    cursor:pointer;
    display:flex;
    padding:4px;
    flex-shrink:0;
    transition:color .2s var(--ease);
  }
  #mute:hover{ color:var(--green); }
  #mute svg{ width:18px; height:18px; }

  #volume{
    -webkit-appearance:none;
    appearance:none;
    width:100%;
    height:2px;
    background:var(--line);
    border-radius:2px;
    cursor:pointer;
  }

  #volume::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:12px;
    height:12px;
    border-radius:50%;
    background:var(--green);
    cursor:pointer;
    transition:transform .15s var(--ease);
  }
  #volume::-webkit-slider-thumb:hover{ transform:scale(1.25); }
  #volume::-moz-range-thumb{
    width:12px; height:12px; border-radius:50%;
    background:var(--green); border:none; cursor:pointer;
  }

  .status{
    margin-top:20px;
    font-family:var(--font-mono);
    font-size:12px;
    letter-spacing:.1em;
    color:var(--muted);
    min-height:1.2em;
    transition:color .2s var(--ease);
  }

  .status[data-state="on-air"]{ color:var(--green); }
  .status[data-state="error"]{ color:var(--red); }

  /* ---------- footer links ---------- */
  .links{
    margin-top:44px;
    display:flex;
    justify-content:center;
    gap:16px;
  }

  .links a{
    width:96px;
    height:64px;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#fff;
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:12px 16px;
    opacity:.85;
    transition:transform .2s var(--ease), border-color .2s var(--ease), box-shadow .2s var(--ease), opacity .2s var(--ease);
  }

  .links a:hover,
  .links a:focus-visible{
    transform:translateY(-3px);
    border-color:var(--green-dim);
    box-shadow:0 0 24px rgba(57,255,106,.18);
    opacity:1;
  }

  .links img{
    max-width:100%;
    max-height:100%;
    object-fit:contain;
  }

  .footer{
    margin-top:34px;
    font-family:var(--font-mono);
    font-size:10px;
    letter-spacing:.05em;
    color:#6a6a72;
  }

  .sr-only{
    position:absolute;
    width:1px; height:1px;
    padding:0; margin:-1px;
    overflow:hidden;
    clip:rect(0,0,0,0);
    white-space:nowrap;
    border:0;
  }

  @media (max-width:560px){
    .player{ padding:40px 24px; }
    .links{ flex-wrap:wrap; gap:12px; }
    .links a{ width:calc(50% - 6px); max-width:130px; height:54px; }
    .sponsors a{ width:calc(50% - 7px); max-width:150px; }
  }
</style>
</head>

<script>
(() => {
  const radio = document.getElementById('radio');
  const player = document.getElementById('player');
  const playBtn = document.getElementById('play');
  const playIcon = document.getElementById('playIcon');
  const pauseIcon = document.getElementById('pauseIcon');
  const status = document.getElementById('status');
  const volumeSlider = document.getElementById('volume');
  const muteBtn = document.getElementById('mute');
  const volOn = document.getElementById('volOn');
  const volOff = document.getElementById('volOff');
  const logo = document.getElementById('logo');

  radio.volume = volumeSlider.value / 100;

  let userWantsPlay = false;
  let retryCount = 0;
  let retryTimer = null;
  const MAX_RETRY_DELAY = 30000;

  function setStatus(text, state){
    status.textContent = text;
    status.dataset.state = state;
  }

  function showPauseIcon(show){
    playIcon.style.display = show ? 'none' : 'block';
    pauseIcon.style.display = show ? 'block' : 'none';
    playBtn.setAttribute('aria-label', show ? 'Pausar' : 'Reproducir');
    playBtn.setAttribute('aria-pressed', show ? 'true' : 'false');
  }

  function clearRetry(){
    if (retryTimer){ clearTimeout(retryTimer); retryTimer = null; }
  }

  function scheduleRetry(){
    if (!userWantsPlay || retryTimer) return;
    player.classList.remove('is-playing');
    const delay = Math.min(1000 * (2 ** retryCount), MAX_RETRY_DELAY);
    retryCount++;
    setStatus(`RECONNECTING IN ${Math.round(delay/1000)}S...`, 'error');
    retryTimer = setTimeout(() => {
      retryTimer = null;
      if (!userWantsPlay) return;
      radio.load();
      attemptPlay();
    }, delay);
  }

  async function attemptPlay(){
    try{
      setStatus('CONNECTING...', 'offline');
      await radio.play();
    } catch(err){
      if (err && err.name === 'AbortError') return; // load() interrumpió el play, se reintenta solo
      setStatus('STREAM ERROR — TAP TO RETRY', 'error');
      showPauseIcon(false);
      player.classList.remove('is-playing');
      userWantsPlay = false;
    }
  }

  function stopPlayback(){
    userWantsPlay = false;
    clearRetry();
    radio.pause();
    showPauseIcon(false);
    player.classList.remove('is-playing');
    setStatus('OFFLINE', 'offline');
  }

  function togglePlay(){
    if (!userWantsPlay){
      userWantsPlay = true;
      retryCount = 0;
      showPauseIcon(true);
      attemptPlay();
    } else {
      stopPlayback();
    }
  }

  playBtn.addEventListener('click', togglePlay);

  /* volumen y mute */
  function syncMuteIcon(){
    const muted = radio.muted || radio.volume === 0;
    volOn.style.display = muted ? 'none' : 'block';
    volOff.style.display = muted ? 'block' : 'none';
    muteBtn.setAttribute('aria-pressed', muted ? 'true' : 'false');
    muteBtn.setAttribute('aria-label', muted ? 'Activar sonido' : 'Silenciar');
  }

  volumeSlider.addEventListener('input', () => {
    radio.volume = volumeSlider.value / 100;
    if (radio.volume > 0) radio.muted = false;
    syncMuteIcon();
  });

  muteBtn.addEventListener('click', () => {
    radio.muted = !radio.muted;
    syncMuteIcon();
  });

  /* eventos del stream */
  radio.addEventListener('playing', () => {
    retryCount = 0;
    clearRetry();
    setStatus('ON AIR', 'on-air');
    showPauseIcon(true);
    player.classList.add('is-playing');
  });

  radio.addEventListener('waiting', () => {
    if (userWantsPlay) setStatus('BUFFERING...', 'offline');
  });

  radio.addEventListener('error', () => {
    if (userWantsPlay) scheduleRetry();
    else setStatus('OFFLINE', 'offline');
  });

  radio.addEventListener('stalled', () => {
    if (userWantsPlay) scheduleRetry();
  });

  radio.addEventListener('ended', () => {
    if (userWantsPlay) scheduleRetry();
  });

  /* si el dispositivo recupera conexión, reconectar al instante */
  window.addEventListener('online', () => {
    if (userWantsPlay && retryTimer){
      clearRetry();
      retryCount = 0;
      radio.load();
      attemptPlay();
    }
  });

  /* controles del sistema (pantalla de bloqueo, teclas multimedia) */
  if ('mediaSession' in navigator){
    navigator.mediaSession.metadata = new MediaMetadata({
      title: 'En directo',
      artist: 'Glitch Channel'
    });
    navigator.mediaSession.setActionHandler('play', () => { if (!userWantsPlay) togglePlay(); });
    navigator.mediaSession.setActionHandler('pause', () => { if (userWantsPlay) stopPlayback(); });
  }

  /* barra espaciadora = play/pausa (si no hay foco en un control) */
  document.addEventListener('keydown', (e) => {
    if (e.code !== 'Space') return;
    const tag = (document.activeElement || {}).tagName;
    if (tag === 'BUTTON' || tag === 'INPUT' || tag === 'A') return;
    e.preventDefault();
    togglePlay();
  });

  /* glitch periódico del logo */
  function triggerGlitch(){
    logo.classList.add('is-glitching');
    setTimeout(() => logo.classList.remove('is-glitching'), 180);
  }
  function scheduleGlitch(){
    const delay = 3000 + Math.random() * 5000;
    setTimeout(() => { triggerGlitch(); scheduleGlitch(); }, delay);
  }
  if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    scheduleGlitch();
  }

  syncMuteIcon();
})();
</script>
